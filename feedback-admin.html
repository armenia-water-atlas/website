<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Հաղորդումների կառավարում · Հետադարձ կապ</title><link rel="stylesheet" href="feedback.css?v=20261010"><script src="feedback-common.js?v=20261010" defer></script><script src="feedback-admin.js?v=20261010" defer></script></head><body class="feedback-page"><header><strong>Հայաստանի ջրային ատլաս</strong><a href="contact.html">← Հետադարձ կապ</a></header><main><h1>Հաղորդումների կառավարում</h1><p class="intro">Մուտքը նախատեսված է Ատլասի պատասխանատուների համար։ Հաստատված նոր օբյեկտներն ու ուղղումները անմիջապես պահպանվում են Ատլասի շտեմարանում։</p><section id="login-section" class="card login-card"><h2>Մուտք գործել</h2><form id="login-form"><label>Հաշվի էլեկտրոնային հասցեն<input id="email" type="email" autocomplete="username" required></label><label>Գաղտնաբառ<input id="password" type="password" autocomplete="current-password" required></label><button id="login-button" class="primary">Մուտք գործել</button></form></section><p id="admin-status" class="status" role="status" aria-live="polite"></p><div id="admin-panel" hidden><div class="toolbar"><span id="account"></span><button id="refresh" type="button">Թարմացնել ցանկը</button><button id="logout" type="button">Դուրս գալ</button></div><div class="admin-layout"><aside class="card"><h2>Հաղորդումներ</h2><label>Կարգավիճակ<select id="filter"><option value="pending">Սպասում են ստուգման</option><option value="needs_details">Ճշտում է պահանջվում</option><option value="accepted">Ընդունված</option><option value="rejected">Մերժված</option><option value="all">Բոլորը</option></select></label><p id="queue-count" class="help"></p><div id="queue" class="report-list"></div><div class="actions"><button id="prev" type="button">Նախորդ</button><button id="next" type="button">Հաջորդ</button></div></aside><section id="review" class="card"><p>Ընտրեք հաղորդումը՝ դիտելու և որոշում կայացնելու համար։</p></section></div></div><noscript>Կառավարման էջի համար անհրաժեշտ է JavaScript։</noscript></main></body></html>
