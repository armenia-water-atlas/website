<!DOCTYPE html>
<html lang="hy">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Հայաստանի ջրային ատլաս</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Atlas styles -->
  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

<header class="site-header">

  <div class="site-header-inner">

    <h1 class="site-title">
      Հայաստանի ջրային ատլաս
    </h1>

    <p class="site-subtitle">
      Հայաստանի գետերի, լճերի, ջրվեժների և այլ
      ջրային օբյեկտների տեղեկատվական ատլաս
    </p>

  </div>

</header>


<main class="atlas-layout">

  <!-- LEFT SIDEBAR -->

  <aside class="sidebar">

    <h2>Ջրային օբյեկտներ</h2>


    <!-- SEARCH -->

    <div class="search-box">

      <label for="search">
        Որոնում
      </label>

      <input
        type="search"
        id="search"
        placeholder="Օրինակ՝ Շաքի"
        autocomplete="off"
      >

    </div>


    <!-- FILTERS -->

    <div class="filter-section">

      <div class="filter-title">
        Տեսակ
      </div>

      <div class="filter-list">

        <label class="filter-option">
          <input
            class="type-filter"
            type="checkbox"
            value="river"
            checked
          >
          Գետեր
        </label>


        <label class="filter-option">
          <input
            class="type-filter"
            type="checkbox"
            value="waterfall"
            checked
          >
          Ջրվեժներ
        </label>


        <label class="filter-option">
          <input
            class="type-filter"
            type="checkbox"
            value="lake"
            checked
          >
          Լճեր
        </label>


        <label class="filter-option">
          <input
            class="type-filter"
            type="checkbox"
            value="reservoir"
            checked
          >
          Ջրամբարներ
        </label>


        <label class="filter-option">
          <input
            class="type-filter"
            type="checkbox"
            value="canal"
            checked
          >
          Ջրանցքներ
        </label>


        <label class="filter-option">
          <input
            class="type-filter"
            type="checkbox"
            value="spring"
            checked
          >
          Աղբյուրներ
        </label>


        <label class="filter-option">
          <input
            class="type-filter"
            type="checkbox"
            value="wetland"
            checked
          >
          Խոնավ տարածքներ
        </label>

      </div>

    </div>


    <!-- STATUS -->

    <div
      id="status"
      class="status-box"
    >
      Բեռնվում են տվյալները...
    </div>


    <!-- OBJECT LIST -->

    <div class="object-list">

      <h3>
        Օբյեկտների ցանկ
      </h3>

      <ul
        id="object-items"
        class="object-items"
      ></ul>

    </div>

  </aside>


  <!-- MAP -->

  <section class="map-panel">

    <div class="map-card">

      <div class="map-toolbar">

        <h2>
          Քարտեզ
        </h2>

        <span
          id="map-count"
          class="map-count"
        >
          Քարտեզագրված՝ 0
        </span>

      </div>

      <div id="map"></div>

    </div>

  </section>

</main>


<footer class="site-footer">

  Հայաստանի ջրային ատլաս —
  փորձնական տարբերակ

</footer>


<!-- Leaflet -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<!-- Atlas application -->

<script src="app.js"></script>

</body>

</html>
